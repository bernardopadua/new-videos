{% extends "base/base.html" %}

{% block title %}Edit Profile - nVideos{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8 pb-20">
    
    <!-- PAGE HEADER -->
    <div class="border-b border-white/10 pb-6 mb-10">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Edit Profile Settings</h1>
        <p class="text-sm text-gray-400 mt-2">Update your personal information, avatar, password, and account settings.</p>
    </div>

    <!-- EDIT FORM -->
    <form action="/user/edit" method="POST" enctype="multipart/form-data" class="space-y-10">
        
        <!-- SECTION 1: AVATAR UPLOAD COMPONENT -->
        <div id="avatar-upload-root"></div>
        <script type="module" src="{{ url_for('user_details.static', filename='dist/ausd.js') }}"></script>

        <!-- SECTION 2: PERSONAL INFORMATION FORM -->
        <div class="p-8 sm:p-10 rounded-3xl bg-surface/90 border border-white/10 backdrop-blur-md space-y-8 shadow-xl">
            
            <h3 class="text-lg font-bold text-white border-b border-white/10 pb-4 flex items-center gap-2">
                <span>👤</span> Personal Information
            </h3>

            <!-- FORM GRID WITH BALANCED MARGINS -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 pt-2">
                <!-- FIRST NAME -->
                <div class="space-y-2">
                    <label for="user_name" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        First Name <span class="text-brand">*</span>
                    </label>
                    <input id="user_name" name="user_name" type="text" maxlength="100" required 
                        placeholder="John" 
                        value="John"
                        class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm">
                </div>

                <!-- SURNAME -->
                <div class="space-y-2">
                    <label for="user_surname" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        Last Name <span class="text-brand">*</span>
                    </label>
                    <input id="user_surname" name="user_surname" type="text" maxlength="150" required 
                        placeholder="Doe" 
                        value="Doe"
                        class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                <!-- EMAIL -->
                <div class="space-y-2">
                    <label for="user_email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        Email Address <span class="text-brand">*</span>
                    </label>
                    <input id="user_email" name="user_email" type="email" maxlength="150" required 
                        placeholder="john.doe@example.com" 
                        value="john.doe@example.com"
                        class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm">
                </div>

                <!-- BIRTH DATE -->
                <div class="space-y-2">
                    <label for="user_birth_date" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        Date of Birth
                    </label>
                    <input id="user_birth_date" name="user_birth_date" type="date" 
                        value="1995-06-15"
                        class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm [color-scheme:dark]">
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="space-y-2">
                <label for="user_password" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                    Password <span class="text-brand">*</span>
                </label>
                <input id="user_password" name="user_password" type="password" maxlength="300" required 
                    placeholder="••••••••" 
                    value="12345678"
                    class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm">
            </div>

        </div>

        <!-- SECTION 3: ADMINISTRATIVE CONTROLS -->
        <div class="p-8 sm:p-10 rounded-3xl bg-brand/10 border border-brand/20 backdrop-blur-md space-y-8 shadow-xl">
            
            <h3 class="text-lg font-bold text-white border-b border-brand/20 pb-4 flex items-center gap-2">
                <span>🛡️</span> Administrative Controls
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 pt-2">
                <!-- PERMISSION -->
                <div class="space-y-2">
                    <label for="user_permission" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        User Permission Level
                    </label>
                    <select id="user_permission" name="user_permission" required 
                        class="w-full bg-[#121212] border border-white/10 px-5 py-3.5 rounded-xl text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition duration-200 text-sm [color-scheme:dark]">
                        <option value="U" selected>User (Standard Access)</option>
                        <option value="A">Administrator (Full Access)</option>
                    </select>
                </div>

                <!-- ACCOUNT ACTIVE STATUS -->
                <div class="space-y-2">
                    <label for="user_is_active" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">
                        Account Status
                    </label>
                    <div class="flex items-center gap-3 pt-2">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="user_is_active" name="user_is_active" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-[#121212] border border-white/20 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand"></div>
                        </label>
                        <span class="text-sm font-medium text-gray-200">Account Active</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- ACTION BUTTONS (GENEROUS PADDING AND VISIBLE CANCEL BUTTON) -->
        <div class="pt-4 flex items-center justify-end gap-4">
            <a href="/" class="px-6 py-3 text-xs font-semibold text-white bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl transition shadow-sm">
                Cancel
            </a>
            <button type="submit" class="px-7 py-3 text-xs font-semibold text-white bg-brand rounded-xl hover:bg-[#772ce8] transition shadow-lg shadow-brand/25 active:scale-95">
                Save Profile
            </button>
        </div>

    </form>
</div>

<script>
function previewUserAvatar(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('userAvatarPreview');
            const placeholder = document.getElementById('userAvatarPlaceholder');
            preview.src = e.target.result;
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}
