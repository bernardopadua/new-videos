<!-- view/templates/base.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}nVideos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('base.static', filename='dist/main.css') }}">
</head>
<body class="bg-bg-dark">
    <!-- NAVBAR -->
    <nav class="fixed top-0 w-full h-14 bg-bg-dark border-b border-white/10 flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-4">
            <span class="text-xl cursor-pointer">☰</span>
            <a href="/" class="text-brand font-bold text-xl">nVideos</a>
        </div>
        <div class="hidden md:flex flex-1 max-w-xl mx-10">
            <input type="text" placeholder="Pesquisar" class="w-full bg-[#121212] border border-white/10 px-4 py-1.5 rounded-l-full focus:border-brand outline-none">
            <button class="bg-white/10 px-5 rounded-r-full border-l-0 border border-white/10">🔍</button>
        </div>
        <div class="flex items-center gap-3">
            {% if not userIsLoggedIn() %}
            <a href="/login" class="px-4 py-1.5 text-sm font-medium hover:bg-white/10 rounded-full">Sign In</a>
            <a href="/register" class="px-4 py-1.5 text-sm font-medium bg-brand rounded-full hover:bg-[#772ce8]">Sign Up</a>
            {% else %}
            <!-- Logout Button with distinct visual styling -->
            <a href="/logout" class="px-4 py-1.5 text-sm font-medium border border-white/10 bg-white/5 hover:bg-white/10 hover:border-white/20 text-white/95 rounded-full transition-all duration-200">Logout</a>

            <!-- Avatar with Dropdown -->
            <div class="relative inline-block text-left" id="user-menu-container">
                <button id="user-menu-button" class="flex text-sm rounded-full focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 focus:ring-offset-bg-dark transition-all duration-200 cursor-pointer" aria-expanded="false" aria-haspopup="true">
                    <span class="sr-only">Open user menu</span>
                    <div class="h-8 w-8 rounded-full bg-brand text-white flex items-center justify-center overflow-hidden">
                        {% set userAvatarURL = getUserAvatar() %}
                        {% if userAvatarURL %}
                        <img src="{{ userAvatarURL }}" alt="Avatar" class="h-full w-full object-cover">
                        {% else %}
                        <svg class="h-full w-full p-1.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        {% endif %}
                    </div>
                </button>

                <!-- Dropdown Menu -->
                <div id="user-menu-dropdown" class="hidden absolute right-0 mt-2 w-48 rounded-xl bg-surface border border-white/10 shadow-2xl py-1.5 text-sm text-white/90 z-50 origin-top-right focus:outline-none transition-all duration-150" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                    <a href="/profile" class="block px-4 py-2 hover:bg-white/5 hover:text-white transition-colors" role="menuitem" tabindex="-1">Meu perfil</a>
                    <a href="/my-videos" class="block px-4 py-2 hover:bg-white/5 hover:text-white transition-colors" role="menuitem" tabindex="-1">Meus vídeos</a>
                    <a href="/upload" class="block px-4 py-2 hover:bg-white/5 hover:text-white transition-colors" role="menuitem" tabindex="-1">Upload</a>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="fixed left-0 top-14 w-60 h-full bg-bg-dark p-2 border-r border-white/5 hidden lg:block">
        <div class="flex flex-col gap-1">
            <a href="/" class="flex items-center gap-4 p-3 hover:bg-white/10 rounded-xl"><span>🏠</span> Início</a>
            <a href="#" class="flex items-center gap-4 p-3 hover:bg-white/10 rounded-xl"><span>🔥</span> Em alta</a>
            <hr class="my-2 border-white/5">
            <a href="#" class="flex items-center gap-4 p-3 hover:bg-white/10 rounded-xl"><span>📚</span> Biblioteca</a>
        </div>
    </aside>

    <!-- CONTENT -->
    <main class="lg:pl-60 pt-14">
        <div class="p-6">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- USER MENU DROPDOWN SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuButton = document.getElementById('user-menu-button');
            const dropdown = document.getElementById('user-menu-dropdown');
            const container = document.getElementById('user-menu-container');

            if (menuButton && dropdown) {
                menuButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
                    menuButton.setAttribute('aria-expanded', !isExpanded);
                    dropdown.classList.toggle('hidden');
                });

                document.addEventListener('click', (e) => {
                    if (container && !container.contains(e.target)) {
                        menuButton.setAttribute('aria-expanded', 'false');
                        dropdown.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>
</html>
